# neofobric-loader 工程配置
# ---- 构建环境 ----
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# ---- 加载器目标 ----
neofobric.mc = 1.21.1
neofobric.neoforge = 21.1.211

# ---- 依赖版本 ----
# ASM：字节码变换的事实标准（Mixin / NeoForge / Connector 均基于它）
neofobric.asm = 9.7

# ---- 是否构建 NeoForge 接入层（需要 JDK 21 + NeoForge MDK 依赖，默认关闭） ----
neofobric.buildNeoforge = false
